name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ubuntu / GCC",   os: ubuntu-latest,  cc: gcc,   cxx: g++,     experimental: false }
          - { name: "Ubuntu / Clang", os: ubuntu-latest,  cc: clang, cxx: clang++, experimental: false }
          - { name: "macOS / Clang",  os: macos-latest,   cc: clang, cxx: clang++, experimental: false }
          - { name: "Windows / MSVC", os: windows-latest, cc: "",    cxx: "",      experimental: true }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then export CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}; fi
          cmake -S . -B build -DCOSMIC_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: ASan + UBSan (CarrierField)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run under sanitizers
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined \
              -ISource Tests/carrierfield_tests.cpp -o carrierfield_san
          ./carrierfield_san
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined \
              -ISource Tests/carrierfield_plugin_tests.cpp -o plugin_core_san
          ./plugin_core_san

  demo-render:
    name: Render demo drone
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build renderer
        run: g++ -std=c++20 -O2 -Wall -Wextra Tools/render_drone.cpp -o render_drone
      - name: Render
        run: ./render_drone carrier_field_demo.wav carrier_field_demo.csv
      - uses: actions/upload-artifact@v4
        with:
          name: carrier-field-demo
          path: |
            carrier_field_demo.wav
            carrier_field_demo.csv

  juce-plugin:
    name: CarrierField plugin (JUCE 8, Linux)
    runs-on: ubuntu-latest
    continue-on-error: true   # first compile against real JUCE has not been run yet; promote to required once green
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev
      - name: Fetch JUCE
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
      - name: Configure
        run: cmake -S . -B build-juce -DJUCE_PATH="$RUNNER_TEMP/JUCE" -DCOSMIC_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build CarrierField (VST3 + Standalone)
        run: cmake --build build-juce --target CarrierField_VST3 CarrierField_Standalone --parallel
